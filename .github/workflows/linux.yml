name: Build Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['Linux/**', '.github/workflows/linux.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (tar.gz + AppImage)
        working-directory: Linux
        run: bash packaging/build-linux.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: FrameCastStudio-linux-${{ matrix.arch }}
          path: |
            Linux/dist/*.AppImage
            Linux/dist/*.tar.gz
            Linux/dist/*.sha256

      - name: Attacher à la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Linux/dist/*.AppImage
            Linux/dist/*.tar.gz
            Linux/dist/*.sha256
